name: CD

# Entrega contínua: a cada merge na main
#   1) publica as imagens versionadas (tag = SHA do commit) no GHCR;
#   2) sobe um cluster Kubernetes efêmero, implanta EXATAMENTE essas imagens e roda o smoke test.
# Só considera a entrega válida se o ambiente subir e o smoke test passar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publicar imagem (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [flash-sales, contratos]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome da imagem (minúsculo)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-and-verify:
    name: Deploy em cluster efêmero + smoke test
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: devops
          config: k8s/kind-config.yaml
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Puxa as imagens publicadas e as disponibiliza no cluster
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for app in flash-sales contratos; do
            docker pull "${REGISTRY}/${OWNER}/${app}:${GITHUB_SHA}"
            docker tag  "${REGISTRY}/${OWNER}/${app}:${GITHUB_SHA}" "${app}:local"
          done
      - name: Credenciais efêmeras (geradas na hora, nunca versionadas)
        run: |
          {
            echo "DB_USER=app"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "GRAFANA_ADMIN_USER=admin"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env
      - name: Provisiona e implanta
        run: SKIP_BUILD=1 ./scripts/k8s-up.sh
      - name: Smoke test
        run: MODE=k8s ./scripts/smoke-test.sh
      - name: Estado do HPA
        run: kubectl -n devops-project get hpa,pods
      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl -n devops-project get pods -o wide
          kubectl -n devops-project describe pods | tail -n 120
          kubectl -n devops-project logs deploy/flash-sales --tail=80 || true
          kubectl -n devops-project logs deploy/contratos --tail=80 || true
