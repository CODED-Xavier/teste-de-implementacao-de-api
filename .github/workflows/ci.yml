name: CI

# Integração contínua: roda em todo push e PR. Falhou aqui, não chega à main.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [flash-sales, contratos]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck / build
        run: npm run build
      - name: Testes unitários
        run: npm test -- --ci
      - name: Auditoria de dependências (produção)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true # informativo; transformar em bloqueante quando o backlog de CVEs estiver zerado

  docker:
    name: Imagem (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        app: [flash-sales, contratos]
    steps:
      - uses: actions/checkout@v4
      - name: Lint do Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/${{ matrix.app }}/Dockerfile
          failure-threshold: error
      - uses: docker/setup-buildx-action@v3
      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          load: true
          tags: ${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.app }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  infra:
    name: Validação da infraestrutura como código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renderiza Kustomize
        run: kubectl kustomize --load-restrictor=LoadRestrictionsNone k8s/overlays/local > /tmp/rendered.yaml
      - name: Valida schemas Kubernetes (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp
          /tmp/kubeconform -strict -summary -kubernetes-version 1.31.0 /tmp/rendered.yaml
      - name: Valida docker-compose
        run: docker compose --env-file .env.example config -q
      - name: ShellCheck dos scripts
        run: shellcheck -S warning scripts/*.sh
